map $uri $booking_limit_key {
    default          "${binary_remote_addr}:booking";
    ~^/api/bookings/ "${binary_remote_addr}:receipt";
}
limit_req_zone $booking_limit_key zone=booking:10m rate=5r/s;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control no-store always;

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 'Healthy';
    }

    location /api/ {
        limit_req zone=booking burst=20 nodelay;
        limit_req_status 429;
        set $api query-api:8080;
        if ($request_method = POST) { set $api command-api:8080; }
        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
